<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCoding Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f8fa;
    --surface: #ffffff;
    --surface-hover: #f3f3f6;
    --border: #e5e5ea;
    --border-hover: #d1d1d8;
    --text: #1a1a2e;
    --text-secondary: #6b6b80;
    --text-muted: #9898a8;
    --accent: #7c3aed;
    --glow: rgba(124, 58, 237, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 2.5rem;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 0.5rem;
    color: var(--text);
  }

  .header p {
    color: var(--text-secondary);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  /* Search */
  .search-wrap {
    position: relative;
    max-width: 480px;
    margin: 0 auto 1.25rem;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    width: 16px;
    height: 16px;
  }

  .search-input {
    width: 100%;
    padding: 0.65rem 1rem 0.65rem 2.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.8125rem;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--glow);
  }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.375rem;
    margin-bottom: 2rem;
  }

  .chip {
    padding: 0.35rem 0.75rem;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 500;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    user-select: none;
  }

  .chip:hover {
    background: var(--surface-hover);
    border-color: var(--border-hover);
    color: var(--text);
  }

  .chip.active {
    background: #7c3aed;
    border-color: #7c3aed;
    color: #fff;
  }

  /* Card grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.625rem;
  }

  .card {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.18s ease;
    cursor: pointer;
  }

  .card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
  }

  .card-body {
    flex: 1;
    min-width: 0;
  }

  .card-icon {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .card-name {
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-desc {
    font-size: 0.75rem;
    color: var(--text-secondary);
    line-height: 1.45;
    max-height: calc(1.45em * 2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .card-emoji {
    font-size: 1.25rem;
    flex-shrink: 0;
    line-height: 1;
    margin-top: 0.15rem;
  }

  /* Section label */
  .section-label {
    grid-column: 1 / -1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6875rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1rem 0 0.25rem;
    text-align: left;
  }

  .section-label:first-child { padding-top: 0; }

  /* Footer */
  .footer {
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.6875rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .footer a {
    color: var(--text-secondary);
    text-decoration: none;
  }
  .footer a:hover { color: var(--text); }

  /* States */
  .empty, .loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-size: 0.8125rem;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .container { padding: 2rem 1rem 1.5rem; }
    .header h1 { font-size: 1.5rem; }
    .grid { grid-template-columns: 1fr; }
    .footer { flex-direction: column; gap: 0.375rem; text-align: center; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>VibeCoding Tools</h1>
    <p>Инструменты для вайб-кодинга — AI, деплой, дизайн и утилиты</p>
  </div>

  <div class="search-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
    </svg>
    <input type="text" class="search-input" id="search" placeholder="Поиск по названию или описанию..." autocomplete="off">
  </div>

  <div class="filters" id="filters"></div>

  <div class="grid" id="content">
    <div class="loading">Загрузка...</div>
  </div>

  <div class="footer">
    <span><span id="count">0</span> инструментов · <span id="date">—</span></span>
    <a href="https://github.com/kksyai/VibeCodingTools" target="_blank">GitHub</a>
  </div>
</div>

<script>
const categoryLabels = {
  "ai-models":  "AI-модели",
  "ai-editors": "Редакторы",
  "skills-mcp": "Skills",
  "deploy":     "Деплой",
  "design":     "Дизайн",
  "docs":       "Документация",
  "utils":      "Утилиты"
};

const categoryEmoji = {
  "ai-models":  "\u{1F916}",
  "ai-editors": "\u{1F4BB}",
  "skills-mcp": "\u{1F9E9}",
  "deploy":     "\u{1F680}",
  "design":     "\u{1F3A8}",
  "docs":       "\u{1F4DA}",
  "utils":      "\u{1F527}"
};

let allResources = [];
let activeFilter = null;

async function init() {
  try {
    const resp = await fetch('/data/resources.json?t=' + Date.now());
    const data = await resp.json();

    for (const [catId, cat] of Object.entries(data.categories)) {
      for (const tool of cat.tools) {
        allResources.push({ ...tool, category: catId, categoryName: cat.name });
      }
    }

    document.getElementById('date').textContent = data.lastUpdated || '—';
    buildFilters();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty">Ошибка загрузки данных</div>';
  }
}

function buildFilters() {
  const el = document.getElementById('filters');

  const allChip = document.createElement('button');
  allChip.className = 'chip active';
  allChip.textContent = 'Все';
  allChip.addEventListener('click', () => setFilter(null, allChip));
  el.appendChild(allChip);

  for (const [catId, label] of Object.entries(categoryLabels)) {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = (categoryEmoji[catId] || '') + ' ' + label;
    chip.addEventListener('click', () => setFilter(catId, chip));
    el.appendChild(chip);
  }
}

function setFilter(catId, chip) {
  activeFilter = catId;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  render();
}

function render() {
  const query = document.getElementById('search').value.toLowerCase().trim();
  const content = document.getElementById('content');
  content.innerHTML = '';

  let filtered = allResources;

  if (activeFilter) {
    filtered = filtered.filter(r => r.category === activeFilter);
  }

  if (query) {
    filtered = filtered.filter(r =>
      r.name.toLowerCase().includes(query) ||
      (r.description && r.description.toLowerCase().includes(query))
    );
  }

  document.getElementById('count').textContent = filtered.length;

  if (filtered.length === 0) {
    content.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }

  const grouped = {};
  for (const r of filtered) {
    if (!grouped[r.category]) grouped[r.category] = [];
    grouped[r.category].push(r);
  }

  for (const [catId, items] of Object.entries(grouped)) {
    if (!activeFilter) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = (categoryEmoji[catId] || '') + '  ' + items[0].categoryName;
      content.appendChild(label);
    }

    for (const tool of items) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = tool.url;
      a.target = '_blank';
      a.rel = 'noopener';

      a.innerHTML =
        '<img class="card-icon" src="' + escapeAttr(tool.icon) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="card-body">' +
          '<div class="card-name">' + escapeHTML(tool.name) + '</div>' +
          '<div class="card-desc">' + escapeHTML(tool.description || '') + '</div>' +
        '</div>' +
        '<span class="card-emoji">' + (categoryEmoji[tool.category] || '') + '</span>';

      content.appendChild(a);
    }
  }
}

function escapeHTML(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('search').addEventListener('input', render);
init();
</script>
</body>
</html>
